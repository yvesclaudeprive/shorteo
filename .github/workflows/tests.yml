name: Tests

# Vérifications avant toute publication : logique de l'interface, lecture seule,
# et saisie automatique sous un vrai Windows.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Tests de l'interface (logique)
        shell: pwsh
        run: |
          npx vitest run *>&1 | Tee-Object -FilePath vitest.log
          if ($LASTEXITCODE -ne 0) {
            $t = Get-Content vitest.log -Raw
            $t = $t.Substring([Math]::Max(0, $t.Length - 3500)) -replace '%', '%25' -replace "`r?`n", '%0A'
            Write-Output "::error title=Tests interface::$t"
            exit 1
          }

      - name: Compilation de l'interface
        run: npm run build

      - name: Tests Rust (lecture seule)
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib *>&1 | Tee-Object -FilePath rust.log
          if ($LASTEXITCODE -ne 0) {
            $t = Get-Content rust.log -Raw
            $t = $t.Substring([Math]::Max(0, $t.Length - 3500)) -replace '%', '%25' -replace "`r?`n", '%0A'
            Write-Output "::error title=Tests Rust::$t"
            exit 1
          }

      - name: Test clavier Windows (Bloc-notes)
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test windows_keys -- --ignored --nocapture *>&1 | Tee-Object -FilePath keys.log
          if ($LASTEXITCODE -ne 0) {
            $t = Get-Content keys.log -Raw
            $t = $t.Substring([Math]::Max(0, $t.Length - 3500)) -replace '%', '%25' -replace "`r?`n", '%0A'
            Write-Output "::error title=Test clavier Windows::$t"
            exit 1
          }
          Write-Output "::notice title=Test clavier Windows::Bloc-notes : premier plan, Échap, frappe de /, collage et saisie d'un mot vérifiés"

      # La mise à jour depuis Shorteo lance l'installateur en mode passif (/P /NS) :
      # on vérifie sur un vrai Windows que la dernière version publiée s'installe ainsi,
      # sans question ni fenêtre bloquante.
      - name: Installation passive (comme la mise à jour automatique)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "shorteo-ci" }
          $rel = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/${{ github.repository }}/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -like "*_x64-setup.exe" } | Select-Object -First 1
          if (-not $asset) { Write-Output "::error title=Installation passive::installateur introuvable"; exit 1 }
          Invoke-WebRequest -Headers @{ "User-Agent" = "shorteo-ci" } $asset.browser_download_url -OutFile setup.exe
          $t0 = Get-Date
          $p = Start-Process -FilePath .\setup.exe -ArgumentList "/P","/NS" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Output "::error title=Installation passive::l'installateur ne s'est pas terminé (bloqué ?)"; exit 1 }
          $dir = Join-Path $env:LOCALAPPDATA "Shorteo"
          Get-ChildItem $dir | Format-Table Name, Length
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          $ver = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Shorteo" -ErrorAction SilentlyContinue).DisplayVersion
          if (-not $exe -or -not $ver) { Write-Output "::error title=Installation passive::Shorteo n'est pas installé (code $($p.ExitCode))"; exit 1 }
          Write-Output "::notice title=Installation passive::$($rel.tag_name) installée sans question en $([int]((Get-Date) - $t0).TotalSeconds) s : $($exe.Name), version $ver"

