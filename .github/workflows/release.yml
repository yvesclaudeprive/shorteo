name: Installateur Windows

# Se lance quand le numéro de version change (src-tauri/tauri.conf.json),
# quand une version est taguée (ex. v0.1.0), ou à la main (onglet Actions).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Nouveautés = messages des modifications depuis la version précédente
      # (affichés dans Shorteo, dans le bandeau « nouvelle version disponible »)
      - name: Notes de version
        id: notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          range=${prev:+$prev..HEAD}
          {
            echo "body<<NOTES_EOF"
            echo "### Nouveautés"
            git log --no-merges --pretty='- %s' $range | grep -v '^- Shorteo v' | head -40
            echo
            echo "Dans Shorteo : cliquez sur **Mettre à jour** dans le bandeau. Sinon, téléchargez **Shorteo_…_x64-setup.exe** ci-dessous et lancez-le."
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Shorteo v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
